name: Django CI

on: 
  push:
    branches: 
      - main
      - master

  pull_request:
    branches:
      - main
    
jobs:
  test:
    runs-on: ubutnu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teamsync              # Database name
          POSTGRES_USER: teamsync_user       # Database user
          POSTGRES_PASSWORD: teamsync_password  # Database password

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        
        ports:
          - 5432:5432
        
    steps:

      # ==========================================
      # STEP 1: Checkout Code
      # ==========================================
      # This downloads your repository code into the virtual machine.
      # Without this step, the machine has no code to test.

      - name: Checkout code
        uses: actions/checkout@v4

      # "uses" means "use a pre-built action from GitHub Marketplace"
      # actions/checkout@v4 is the official GitHub action for downloading code
      # @v4 means "use version 4" (stable, well-tested)


      # ==========================================
      # STEP 2: Set Up Python
      # ==========================================
      # The Ubuntu runner doesn't have Python installed by default.
      # This action installs the Python version you specify.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # Must match your Dockerfile Python version

      # "with" passes parameters to the action
      # python-version: '3.12' tells it to install Python 3.12


      # ==========================================
      # STEP 3: Install Dependencies
      # ==========================================
      # This installs Django, DRF, psycopg2, and everything in requirements.txt
      # 
      # "run" means "execute this shell command"
      # The | (pipe) character allows multi-line commands

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # WHY --upgrade pip:
      # - Ensures you have the latest pip (avoids install bugs)
      # WHY -r requirements.txt:
      # - Installs ALL packages your app needs in one command


      # ==========================================
      # STEP 4: Django System Check
      # ==========================================
      # This validates your Django project without running the server.
      # It checks:
      # - Settings are valid
      # - URLs are correctly configured
      # - Models don't have errors
      # - No missing dependencies

      - name: Django System Check
        env:
          # These environment variables are passed to Django
          # They tell Django to connect to the PostgreSQL service container
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: teamsync
          DB_USER: teamsync_user
          DB_PASSWORD: teamsync_password
          DB_HOST: localhost        # ← "localhost" because service runs on same VM
          DB_PORT: 5432
          SECRET_KEY: l0La_ty-27ZKXlOsQHlXk5HBQctsy_ebyjR1cWmWUecgm46UC5AO2kO8rcOH_TtgDUs
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: python manage.py check

      # KEY DIFFERENCE FROM DOCKER:
      # In docker-compose, DB_HOST is "db" (the service name)
      # In GitHub Actions, DB_HOST is "localhost" (same machine)
      # This is because services run on the same VM, not in a separate container network


      # ==========================================
      # STEP 5: Run Migrations
      # ==========================================
      # Creates database tables based on your models.
      # Without this, tests will fail because tables don't exist.

      - name: Run Migrations
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: teamsync
          DB_USER: teamsync_user
          DB_PASSWORD: teamsync_password
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: l0La_ty-27ZKXlOsQHlXk5HBQctsy_ebyjR1cWmWUecgm46UC5AO2kO8rcOH_TtgDUs
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: python manage.py migrate

      # WHY RUN MIGRATIONS IN CI:
      # - Ensures your migrations actually work
           # - Catches migration conflicts early
      # - Creates tables so tests have something to query


      # ==========================================
      # STEP 6: Run Tests
      # ==========================================
      # This is the MAIN EVENT — your Django test suite executes here.
      # If any test fails, the entire pipeline fails and turns red.

      - name: Run Tests
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: teamsync
          DB_USER: teamsync_user
          DB_PASSWORD: teamsync_password
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: l0La_ty-27ZKXlOsQHlXk5HBQctsy_ebyjR1cWmWUecgm46UC5AO2kO8rcOH_TtgDUs
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: python manage.py test

    # WHY USE POSTGRESQL FOR TESTS (NOT SQLITE):
    # - Tests run against the SAME database as production
    # - Catches PostgreSQL-specific bugs (e.g., JSONField, full-text search)
    # - Ensures migrations work on PostgreSQL


    # ==========================================
    # STEP 7: Code Formatting Check (Optional)
    # ==========================================
    # This checks if your code follows PEP 8 style guidelines.
    # It doesn't change your code — it just fails if code is messy.

      - name: Check Code Formatting
        run: |
          pip install black flake8
          black --check .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # black --check .  → Fails if code isn't formatted with Black
      # flake8 ...       → Checks for syntax errors and common bugs
      # --select=E9,F63,F7,F82 → Only check critical errors (not style nitpicks)